# GitHub Actions → production deploy over SSH
#
# Required secrets:
#   DEPLOY_HOST      Domain preferred (patygoteknoloji.com)
#   DEPLOY_USER      SSH user (root)
#   DEPLOY_SSH_KEY   OpenSSH private key matching VPS authorized_keys
#
# Optional:
#   DEPLOY_APP_DIR     default /var/www/patygoteknoloji.com
#   DEPLOY_PM2_NAME    default patygo
#   DEPLOY_APP_PORT    default 5173
#   DEPLOY_PUBLIC_URL  default https://patygoteknoloji.com

name: CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: "Manual deploy verification reason"
        required: false
        default: "ops verification"

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy to production
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=0
          [ -n "$DEPLOY_HOST" ] || { echo "Missing secret: DEPLOY_HOST"; missing=1; }
          [ -n "$DEPLOY_USER" ] || { echo "Missing secret: DEPLOY_USER"; missing=1; }
          [ -n "$DEPLOY_SSH_KEY" ] || { echo "Missing secret: DEPLOY_SSH_KEY"; missing=1; }
          if [ "$missing" -ne 0 ]; then
            echo "Missing GitHub Actions repository secrets."
            echo "Add DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY under Settings > Secrets > Actions."
            echo "Prefer DEPLOY_HOST=patygoteknoloji.com (not a raw IP)."
            exit 1
          fi
          if ! printf '%s' "$DEPLOY_SSH_KEY" | grep -Eq "BEGIN (OPENSSH|RSA|EC|ED25519) PRIVATE KEY"; then
            echo "DEPLOY_SSH_KEY format invalid: expected an OpenSSH/PEM private key block."
            exit 1
          fi
          if ! printf '%s' "$DEPLOY_SSH_KEY" | grep -Eq "END (OPENSSH|RSA|EC|ED25519) PRIVATE KEY"; then
            echo "DEPLOY_SSH_KEY format invalid: missing END private key line."
            exit 1
          fi
          key_lines="$(printf '%s\n' "$DEPLOY_SSH_KEY" | wc -l | tr -d ' ')"
          if [ "$key_lines" -lt 3 ]; then
            echo "DEPLOY_SSH_KEY looks truncated (lines=$key_lines). Re-paste full private key."
            exit 1
          fi
          echo "Deploy secrets present (host=$DEPLOY_HOST user=$DEPLOY_USER key_lines=$key_lines)."

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
          DEPLOY_PM2_NAME: ${{ secrets.DEPLOY_PM2_NAME }}
          DEPLOY_APP_PORT: ${{ secrets.DEPLOY_APP_PORT }}
          DEPLOY_PUBLIC_URL: ${{ secrets.DEPLOY_PUBLIC_URL }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          timeout: 40s
          command_timeout: 5m
          envs: DEPLOY_APP_DIR,DEPLOY_PM2_NAME,DEPLOY_APP_PORT,DEPLOY_PUBLIC_URL
          script: |
            set -euo pipefail
            APP_DIR="${DEPLOY_APP_DIR:-/var/www/patygoteknoloji.com}"
            PM2_NAME="${DEPLOY_PM2_NAME:-patygo}"
            APP_PORT="${DEPLOY_APP_PORT:-5173}"
            PUBLIC_URL="${DEPLOY_PUBLIC_URL:-https://patygoteknoloji.com}"
            PUBLIC_URL="${PUBLIC_URL%/}"
            cd "$APP_DIR"
            echo "Deploying $(git rev-parse --short HEAD) -> origin/main in $APP_DIR"
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            npm ci --omit=dev
            pm2 restart "$PM2_NAME" --update-env
            # LF-only helper; do not fail whole deploy if nginx conf path missing.
            sed -i 's/\r$//' "$APP_DIR/scripts/ensure-sitemap-nginx.sh" || true
            bash "$APP_DIR/scripts/ensure-sitemap-nginx.sh" "$APP_PORT" || {
              echo "WARN: ensure-sitemap-nginx.sh failed; continuing to smoke checks"
            }

            LOOP_JSON=""
            i=0
            while [ "$i" -lt 30 ]; do
              if LOOP_JSON="$(curl -fsS --max-time 8 "http://127.0.0.1:${APP_PORT}/api/payment/status" 2>/dev/null)"; then
                echo "health attempt $i: ok"
                echo "$LOOP_JSON" | grep -q '"provider":"akbank"' && break
              else
                echo "health attempt $i: waiting"
              fi
              i=$((i + 1))
              sleep 3
            done
            echo "$LOOP_JSON" | grep -q '"provider":"akbank"' || {
              echo "payment/status not ready after pm2 restart"
              exit 1
            }
            echo "$LOOP_JSON" | grep -Eq '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' && {
              echo "payment/status unexpectedly contains an IPv4"
              exit 1
            } || true
            PUB_JSON="$(curl -fsS --max-time 20 "${PUBLIC_URL}/api/payment/status")"
            echo "$PUB_JSON" | grep -q '"paymentModel"'
            curl -fsS --max-time 20 "${PUBLIC_URL}/listing/all.json" >/dev/null
            curl -fsS --max-time 20 "${PUBLIC_URL}/urunler" | grep -q 'data-catalog-infinite'
            curl -fsS --max-time 20 "${PUBLIC_URL}/assets/data/categories.json" | grep -q '"categories"'
            curl -fsS --max-time 20 "${PUBLIC_URL}/listing/categories.json" | grep -q '"categories"'
            # SEO smoke: bare ANA redirect + dynamic /sitemap (retry while catalog warms)
            REDIR="$(curl -sSI --max-time 20 "${PUBLIC_URL}/bilgisayar-tablet" | tr -d '\r')"
            echo "$REDIR" | grep -qiE '^HTTP/.* 301'
            echo "$REDIR" | grep -qiE '^Location: .*/urunler/bilgisayar-tablet'
            SM_OK=0
            for i in $(seq 0 24); do
              if curl -fsS --max-time 20 "http://127.0.0.1:${APP_PORT}/sitemap" | grep -q 'urunler/'; then
                if curl -fsS --max-time 20 "${PUBLIC_URL}/sitemap" | grep -q 'urunler/'; then
                  SM_OK=1
                  echo "sitemap ready on attempt $i"
                  break
                fi
              fi
              echo "sitemap attempt $i: waiting"
              sleep 3
            done
            [ "$SM_OK" = "1" ] || { echo "sitemap not ready after warm retries"; exit 1; }
            SM_CODE="$(curl -sS -o /tmp/patygo-sitemap.xml -w '%{http_code}' --max-time 30 "${PUBLIC_URL}/sitemap.xml")"
            [ "$SM_CODE" = "200" ] || { echo "sitemap.xml HTTP $SM_CODE"; exit 1; }
            grep -Eq '<urlset|<sitemapindex' /tmp/patygo-sitemap.xml
            echo "$PUB_JSON" | grep -Eq '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' && {
              echo "public payment/status unexpectedly contains an IPv4"
              exit 1
            } || true
            echo "Deploy OK: $(git rev-parse --short HEAD) public=${PUBLIC_URL}"

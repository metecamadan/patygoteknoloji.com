# GitHub Actions → production deploy
#
# Required secrets:
#   DEPLOY_HOST      Domain preferred (patygoteknoloji.com), not a raw IP
#   DEPLOY_USER      SSH user
#   DEPLOY_SSH_KEY   OpenSSH private key
#
# Optional secrets (portable hosting):
#   DEPLOY_APP_DIR     default /var/www/patygo
#   DEPLOY_PM2_NAME    default patygo
#   DEPLOY_APP_PORT    default 5173
#   DEPLOY_PUBLIC_URL  default https://patygoteknoloji.com

name: CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy to production
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=0
          [ -n "$DEPLOY_HOST" ] || { echo "Missing secret: DEPLOY_HOST"; missing=1; }
          [ -n "$DEPLOY_USER" ] || { echo "Missing secret: DEPLOY_USER"; missing=1; }
          [ -n "$DEPLOY_SSH_KEY" ] || { echo "Missing secret: DEPLOY_SSH_KEY"; missing=1; }
          if [ "$missing" -ne 0 ]; then
            echo "Missing GitHub Actions repository secrets."
            echo "Add DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY under Settings > Secrets > Actions."
            echo "Prefer DEPLOY_HOST=patygoteknoloji.com (not a raw IP)."
            exit 1
          fi
          if ! printf '%s' "$DEPLOY_SSH_KEY" | grep -q "BEGIN OPENSSH PRIVATE KEY"; then
            echo "DEPLOY_SSH_KEY format invalid: must include -----BEGIN OPENSSH PRIVATE KEY-----"
            exit 1
          fi
          if ! printf '%s' "$DEPLOY_SSH_KEY" | grep -q "END OPENSSH PRIVATE KEY"; then
            echo "DEPLOY_SSH_KEY format invalid: must include -----END OPENSSH PRIVATE KEY-----"
            exit 1
          fi
          key_lines="$(printf '%s\n' "$DEPLOY_SSH_KEY" | wc -l | tr -d ' ')"
          if [ "$key_lines" -lt 3 ]; then
            echo "DEPLOY_SSH_KEY looks truncated (lines=$key_lines). Re-paste full private key."
            exit 1
          fi
          echo "Deploy secrets present (host=$DEPLOY_HOST user=$DEPLOY_USER key_lines=$key_lines)."

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
          DEPLOY_PM2_NAME: ${{ secrets.DEPLOY_PM2_NAME }}
          DEPLOY_APP_PORT: ${{ secrets.DEPLOY_APP_PORT }}
          DEPLOY_PUBLIC_URL: ${{ secrets.DEPLOY_PUBLIC_URL }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 3m
          envs: DEPLOY_APP_DIR,DEPLOY_PM2_NAME,DEPLOY_APP_PORT,DEPLOY_PUBLIC_URL
          script: |
            set -euo pipefail
            APP_DIR="${DEPLOY_APP_DIR:-/var/www/patygoteknoloji.com}"
            PM2_NAME="${DEPLOY_PM2_NAME:-patygo}"
            APP_PORT="${DEPLOY_APP_PORT:-5173}"
            PUBLIC_URL="${DEPLOY_PUBLIC_URL:-https://patygoteknoloji.com}"
            PUBLIC_URL="${PUBLIC_URL%/}"
            cd "$APP_DIR"
            echo "Deploying $(git rev-parse --short HEAD) -> origin/main in $APP_DIR"
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            npm ci --omit=dev
            pm2 restart "$PM2_NAME" --update-env
            sleep 2
            # Process health via loopback only (never publish this as the public site URL)
            LOOP_JSON="$(curl -fsS "http://127.0.0.1:${APP_PORT}/api/payment/status")"
            echo "$LOOP_JSON" | grep -q '"provider":"akbank"'
            echo "$LOOP_JSON" | grep -Eq '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' && {
              echo "payment/status unexpectedly contains an IPv4"
              exit 1
            } || true
            # Public domain smoke (source of truth for users / callbacks)
            PUB_JSON="$(curl -fsS "${PUBLIC_URL}/api/payment/status")"
            echo "$PUB_JSON" | grep -q '"paymentModel"'
            echo "$PUB_JSON" | grep -Eq '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' && {
              echo "public payment/status unexpectedly contains an IPv4"
              exit 1
            } || true
            echo "Deploy OK: $(git rev-parse --short HEAD) public=${PUBLIC_URL}"

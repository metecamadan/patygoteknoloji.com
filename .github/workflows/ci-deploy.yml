# GitHub Actions → test gate. Canlı yayın VPS pull-deploy (scripts/watch-github-deploy.js).
# GitHub → sunucu SSH kullanılmaz: VPS authorized_keys boşken appleboy 1 sn'de düşer.

name: CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy to production
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm VPS pull-deploy
        run: |
          echo "Test job passed."
          echo "Production publish is pull-deploy on the VPS (scripts/watch-github-deploy.js)."
          echo "The server fetches origin/main after this Test job is green; GitHub does not SSH."

# =====================================================================
#  Patygo yuk azaltma - Skyversal
#  Geri alma:  rm /etc/nginx/conf.d/00-patygo-hardening.conf
#              nginx -t && systemctl reload nginx
# =====================================================================

# --- Degersiz / agresif botlar -> 403 ---
map $http_user_agent $patygo_bot_block {
    default                  0;
    "~*ahrefsbot"            1;
    "~*semrushbot"           1;
    "~*mj12bot"              1;
    "~*dotbot"               1;
    "~*blexbot"              1;
    "~*petalbot"             1;
    "~*bytespider"           1;
    "~*dataforseo"           1;
    "~*serpstatbot"          1;
    "~*zoominfobot"          1;
    "~*seekportbot"          1;
    "~*barkrowler"           1;
    "~*megaindex"            1;
}

# --- Mesru ama agresif botlar -> yavaslat.  GOOGLEBOT BILEREK YOK. ---
map $http_user_agent $patygo_bot_slow {
    default                  0;
    "~*meta-external"        1;
    "~*facebookexternalhit"  1;
    "~*bingbot"              1;
    "~*yandex"               1;
    "~*amazonbot"            1;
    "~*applebot"             1;
    "~*gptbot"               1;
    "~*claudebot"            1;
    "~*ccbot"                1;
    "~*perplexitybot"        1;
    "~*imagesiftbot"         1;
}

# Bos anahtar -> nginx limiti uygulamaz. Yani normal kullanici etkilenmez.
map $patygo_bot_slow $patygo_slow_key {
    0   "";
    1   $binary_remote_addr;
}

# --- Asla onbelleklenmeyecek yollar ---
map $request_uri $patygo_nocache {
    default        0;
    "~*^/admin"    1;
    "~*^/odeme"    1;
    "~*^/sepet"    1;
    "~*^/hesap"    1;
    "~*^/siparis"  1;
    "~*^/api/"     1;
}

limit_req_zone $patygo_slow_key    zone=patygo_bots:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=patygo_ip:10m   rate=10r/s;
limit_req_status 429;

proxy_cache_path /var/cache/nginx/patygo
                 levels=1:2
                 keys_zone=patygo_cache:20m
                 max_size=1g
                 inactive=6h
                 use_temp_path=off;

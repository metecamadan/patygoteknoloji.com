# Nginx — patygoteknoloji.com (443 server locations)
# Certbot SSL satırları bu dosyada yok; canlıda mevcut sertifika blokları korunur.
# HTML ve /assets Node kilitlense bile diskten servis edilir. /api her zaman Node'a gider.

server {
  server_name patygoteknoloji.com www.patygoteknoloji.com;
  root /var/www/patygoteknoloji.com;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_min_length 256;
  gzip_comp_level 5;
  gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location ^~ /api/ {
    proxy_pass http://127.0.0.1:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }

  location = /assets/data/categories.json {
    proxy_pass http://127.0.0.1:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /listing/categories.json {
    proxy_pass http://127.0.0.1:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /listing/ {
    alias /var/www/patygoteknoloji.com/.runtime/catalog-bootstrap/;
    default_type application/json;
    expires 60s;
    add_header Cache-Control "public" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;
  }

  # /urunler statik HTML (location / try_files); ilk ürünler /listing veya /api/catalog-bootstrap ile gelir

  location ^~ /media/catalog/ {
    alias /var/www/patygoteknoloji.com/.runtime/media/catalog/;
    expires 7d;
    add_header Cache-Control "public" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;
  }

  location ^~ /assets/data/ {
    return 404;
  }

  location ^~ /assets/ {
    expires 1h;
    add_header Cache-Control "public" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri @node;
  }

  location ~ /\. {
    deny all;
  }

  location = / {
    expires 60s;
    add_header Cache-Control "public" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files /index.html @node;
  }

  # POST /admin onto static admin.html is nginx 405; send leftover POST to Node.
  location = /admin {
    error_page 405 = @node;
    expires off;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files /admin.html =404;
  }

  location = /urunler {
    expires 60s;
    add_header Cache-Control "public" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files /urunler.html @node;
  }

  # Legacy product URLs and slug routes must hit Node (301 + slug resolution).
  location = /urun-detay {
    proxy_pass http://127.0.0.1:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
  }

  location / {
    expires 60s;
    add_header Cache-Control "public" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri.html @node;
  }

  location @node {
    proxy_pass http://127.0.0.1:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
  }

  listen 443 ssl;
}

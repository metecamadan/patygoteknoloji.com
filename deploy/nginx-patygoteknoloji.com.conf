# Nginx — patygoteknoloji.com (443 server locations)
# Certbot SSL satırları bu dosyada yok; canlıda mevcut sertifika blokları korunur.
# HTML ve /assets Node kilitlense bile diskten servis edilir. /api her zaman Node'a gider.

# Eski (İ → "i-") ürün slug'ları → 301. Haritayı Node katalog yenilemesinde yazar;
# değişince patygo-nginx-legacy.path nginx'i yeniden yükler.
map_hash_max_size 262144;
map_hash_bucket_size 256;
map $uri $patygo_legacy_product {
  default "";
  include /var/www/patygoteknoloji.com/.runtime/nginx/legacy-product-redirects.map;
}

server {
  server_name patygoteknoloji.com www.patygoteknoloji.com;
  root /var/www/patygoteknoloji.com;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_min_length 256;
  gzip_comp_level 5;
  gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location ^~ /api/ {
    proxy_pass http://127.0.0.1:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }

  location ^~ /listing/ {
    alias /var/www/patygoteknoloji.com/.runtime/catalog-bootstrap/;
    default_type application/json;
    expires 60s;
    add_header Cache-Control "public" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;
  }

  location ^~ /media/catalog/ {
    alias /var/www/patygoteknoloji.com/.runtime/media/catalog/;
    expires 7d;
    add_header Cache-Control "public" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;
  }

  # Nav/admin legacy yolu; listing snapshot ile ayni JSON (Node beklemez).
  location = /assets/data/categories.json {
    rewrite ^ /listing/categories.json last;
  }

  location ^~ /assets/data/ {
    return 404;
  }

  location ^~ /assets/ {
    expires 1h;
    add_header Cache-Control "public" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri @node;
  }

  location ~ /\. {
    deny all;
  }

  location = / {
    expires 60s;
    add_header Cache-Control "public" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files /index.html @node;
  }

  # POST /admin onto static admin.html is nginx 405; send leftover POST to Node.
  location = /admin {
    error_page 405 = @node;
    expires off;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files /admin.html =404;
  }

  # /urunler statik HTML; ürünler client-side /listing/*.json (restart sonrası Node beklemez).
  location = /urunler {
    expires 60s;
    add_header Cache-Control "public" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files /urunler.html =404;
  }

  # Kategori path URL'leri de aynı shell; Node meşgulse 504 olmasın.
  # Client pathname'den ANA/ARA/ALT okur (/listing/*.json).
  location ^~ /urunler/ {
    expires 60s;
    add_header Cache-Control "public" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files /urunler.html =404;
  }

  # Legacy /urun-detay?id= → Node (301 to /{kategori}/{slug}).
  location = /urun-detay {
    proxy_pass http://127.0.0.1:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
  }

  # Dinamik sitemap (diskteki statik sitemap.xml gölgelememeli).
  location = /sitemap.xml {
    proxy_pass http://127.0.0.1:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
  }

  # /{kategori}/{slug} ürün SEO — statik HTML shell; Node meşgul/restart iken 504 olmasın.
  # Client urun-detay.js pathname'den ürünü çözer (/listing/*.json). ^~ /urunler/ ve /api/ önceliklidir.
  location ~ ^/[a-z0-9-]+/[a-z0-9-]+/?$ {
    if ($patygo_legacy_product) {
      return 301 $patygo_legacy_product$is_args$args;
    }
    expires 60s;
    add_header Cache-Control "public" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files /urun-detay.html =404;
  }

  location / {
    expires 60s;
    add_header Cache-Control "public" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri.html @node;
  }

  location @node {
    proxy_pass http://127.0.0.1:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
  }

  listen 443 ssl;
}

# Nginx — patygoteknoloji.com (/etc/nginx/sites-available/patygoteknoloji.com).
# Deploy bu dosyayı olduğu gibi kurar (scripts/install-nginx-conf.sh); canlıda elle düzenleme yapma,
# önce buraya al. ensure-*-nginx.sh betikleri bu dosyayı değiştirmemeli (tests/nginx-conf.test.js).
# HTML ve /assets Node kilitlense bile diskten servis edilir. /api her zaman Node'a gider.

# ?v= taşıyan /assets adresleri içerik değişince yeni etiket alır (tests/asset-versions.test.js zorlar),
# bu yüzden tarayıcıda bir yıl kalabilir; etiketsiz istekler 1 saatte yenilenir.
map $arg_v $patygo_asset_expires {
  ""      1h;
  default 1y;
}

map $arg_v $patygo_asset_cache_control {
  ""      "public";
  default "public, immutable";
}

server {
  server_name patygoteknoloji.com www.patygoteknoloji.com;
  root /var/www/patygoteknoloji.com;
  # patygo-www-apex: tek kanonik host
  if ($host = www.patygoteknoloji.com) { return 301 https://patygoteknoloji.com$request_uri; }

  # --- Skyversal: degersiz botlari engelle ---
  if ($patygo_bot_block) { return 403; }
  # --- Skyversal son ---

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_min_length 256;
  gzip_comp_level 5;
  gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  error_page 404 /404.html;
  location = /404.html {
    add_header X-Robots-Tag "noindex" always;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  }

  # --- Skyversal: bu dosyalar Node'a gitmesin (504 uretiyorlardi) ---
  location = /robots.txt {
    try_files $uri =404;
    expires 1h;
    access_log off;
  }

  location = /favicon.ico {
    try_files $uri =204;
    expires 7d;
    access_log off;
  }
  # --- Skyversal son ---

  # Admin yüklemeleri (ürün görseli, talep yanıtı ekleri) base64 JSON gelir; yalnızca /api/admin/ büyük gövde alır.
  location ^~ /api/admin/ {
    client_max_body_size 16m;
    proxy_pass http://127.0.0.1:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
  }

  location ^~ /api/ {
    # --- Skyversal: hiz limiti (ONBELLEK YOK - odeme/admin/analytics burada) ---
    limit_req zone=patygo_bots burst=5  nodelay;
    limit_req zone=patygo_ip   burst=30 nodelay;
    # --- Skyversal son ---

    proxy_pass http://127.0.0.1:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }

  location ^~ /listing/ {
    alias /var/www/patygoteknoloji.com/.runtime/catalog-bootstrap/;
    default_type application/json;
    expires 60s;
    add_header Cache-Control "public" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    access_log off;
    error_page 404 = @listing_miss;
  }

  location @listing_miss {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    return 404 '{"ok":false,"error":"not found"}';
  }

  # Shopify-style crawler paths are not storefront URLs; fail fast without Node.
  location ^~ /products/ {
    return 404;
  }
  location ^~ /collections/ {
    return 404;
  }

  # /urunler statik HTML; ürünler client-side /listing/*.json (restart sonrası Node beklemez).
  location = /urunler {
    expires 60s;
    add_header Cache-Control "public" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' https://*.googletagmanager.com; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://*.g.doubleclick.net https://*.google.com https://*.google.com.tr; form-action 'self' https://virtualpospaymentgatewaypre.akbank.com https://virtualpospaymentgateway.akbank.com" always;
    try_files /urunler.html =404;
  }

  location ^~ /media/catalog/ {
    alias /var/www/patygoteknoloji.com/.runtime/media/catalog/;
    expires 7d;
    add_header Cache-Control "public" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    access_log off;
  }

  # Nav/admin legacy yolu; listing snapshot ile ayni JSON (Node beklemez).
  location = /assets/data/categories.json {
    rewrite ^ /listing/categories.json last;
  }

  location ^~ /assets/data/ {
    return 404;
  }

  location ^~ /assets/ {
    expires $patygo_asset_expires;
    add_header Cache-Control $patygo_asset_cache_control always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    try_files $uri @node;
  }

  location ~ /\. {
    deny all;
  }

  location = / {
    expires 60s;
    add_header Cache-Control "public" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' https://*.googletagmanager.com; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://*.g.doubleclick.net https://*.google.com https://*.google.com.tr; form-action 'self' https://virtualpospaymentgatewaypre.akbank.com https://virtualpospaymentgateway.akbank.com" always;
    try_files /index.html @node;
  }

  # Panel sayfası tarayıcıda/ara bellekte tutulmaz; statik admin.html'e gelen POST 405 yerine Node'a gider.
  location = /admin {
    error_page 405 = @node;
    expires off;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    try_files /admin.html =404;
  }

  location = /sitemap.xml {
    proxy_pass http://127.0.0.1:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
  }

  location = /urun-detay {
    # --- Skyversal: bot limiti + 60sn micro-cache + kilitlenmede eski kopya ---
    limit_req zone=patygo_bots burst=5  nodelay;
    limit_req zone=patygo_ip   burst=20 nodelay;

    proxy_cache patygo_cache;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    proxy_cache_methods GET HEAD;
    proxy_cache_valid 200 301 302 60s;
    proxy_cache_valid 404 30s;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 15s;
    proxy_cache_use_stale error timeout updating invalid_header
                          http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_cache_bypass $patygo_nocache;
    proxy_no_cache     $patygo_nocache;

    # add_header kullanildigi icin ust seviyedekiler dusuyor, tekrar ekleniyor
    add_header X-Cache-Status $upstream_cache_status always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # --- Skyversal son ---

    proxy_pass http://127.0.0.1:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
  }

  # Eski (İ → "i-") ürün slug'ları: Node'un yazdığı "location = /eski { return 301 /yeni; }" satırları.
  # Dosya değişince patygo-nginx-legacy.path nginx'i yeniden yükler.
  include /var/www/patygoteknoloji.com/.runtime/nginx/legacy-product-redirects.conf;
  # /{kategori}/{slug} ürün SEO — Node başlık/açıklama/h1/fiyatı sunucuda yazar.
  # Client urun-detay.js pathname'den ürünü çözer; Node kapalı/meşgulse @product_shell disk HTML'i (504 yok).
  location ~ ^/[a-z0-9-]+/[a-z0-9-]+/?$ {
    proxy_pass http://127.0.0.1:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    error_page 502 503 504 = @product_shell;
  }

  location @product_shell {
    expires 60s;
    add_header Cache-Control "public" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' https://*.googletagmanager.com; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://*.g.doubleclick.net https://*.google.com https://*.google.com.tr; form-action 'self' https://virtualpospaymentgatewaypre.akbank.com https://virtualpospaymentgateway.akbank.com" always;
    try_files /urun-detay.html =404;
  }

  # Kategori path URL'leri: Node başlık/h1/kanonik yazar; Node kapalı/meşgulse @catalog_shell.
  location ^~ /urunler/ {
    proxy_pass http://127.0.0.1:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    error_page 502 503 504 = @catalog_shell;
  }

  location @catalog_shell {
    expires 60s;
    add_header Cache-Control "public" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' https://*.googletagmanager.com; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://*.g.doubleclick.net https://*.google.com https://*.google.com.tr; form-action 'self' https://virtualpospaymentgatewaypre.akbank.com https://virtualpospaymentgateway.akbank.com" always;
    try_files /urunler.html =404;
  }

  location = /.well-known/security.txt {
    default_type text/plain;
    charset utf-8;
    try_files $uri =404;
  }

  location / {
    expires 60s;
    add_header Cache-Control "public" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' https://*.googletagmanager.com; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://*.g.doubleclick.net https://*.google.com https://*.google.com.tr; form-action 'self' https://virtualpospaymentgatewaypre.akbank.com https://virtualpospaymentgateway.akbank.com" always;
    try_files $uri.html @node;
  }

  location @node {
    # --- Skyversal: bot limiti + 60sn micro-cache + kilitlenmede eski kopya ---
    limit_req zone=patygo_bots burst=5  nodelay;
    limit_req zone=patygo_ip   burst=20 nodelay;

    proxy_cache patygo_cache;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    proxy_cache_methods GET HEAD;
    proxy_cache_valid 200 301 302 60s;
    proxy_cache_valid 404 30s;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 15s;
    proxy_cache_use_stale error timeout updating invalid_header
                          http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_cache_bypass $patygo_nocache;
    proxy_no_cache     $patygo_nocache;

    # add_header kullanildigi icin ust seviyedekiler dusuyor, tekrar ekleniyor
    add_header X-Cache-Status $upstream_cache_status always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # --- Skyversal son ---

    proxy_pass http://127.0.0.1:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
  }

    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/patygoteknoloji.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/patygoteknoloji.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    if ($host = www.patygoteknoloji.com) {
        return 301 https://patygoteknoloji.com$request_uri;
    }

    if ($host = patygoteknoloji.com) {
        return 301 https://$host$request_uri;
    }

  listen 80 default_server;
  server_name patygoteknoloji.com www.patygoteknoloji.com;
    return 404;
}
